name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install yerine npm ci: lockfile birebir uygulanir.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Tanimsiz CSS degiskenini ne derleme ne lint goruyor (bkz.
      # scripts/check-css-vars.mjs). Denetim `build`'in basinda da var ama CI
      # artik derleme yapmiyor; PR'da erken gorunsun diye burada ayrica.
      - run: npm run check:css
