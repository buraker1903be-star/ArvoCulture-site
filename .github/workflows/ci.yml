name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install yerine npm ci: lockfile birebir uygulanir.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          ARC_SUPABASE_URL: ${{ secrets.ARC_SUPABASE_URL }}
          ARC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ARC_SUPABASE_PUBLISHABLE_KEY }}
          ARC_ORGANIZATION_ID: ${{ secrets.ARC_ORGANIZATION_ID }}
          NEXT_PUBLIC_SITE_URL: https://arvoculture.com
