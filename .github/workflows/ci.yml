name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: birim testleri Node'un yerleşik TypeScript tip silmesine
          # dayanıyor; ArvoARC ve ArvoOS CI'ları da 24.
          node-version: 24
          cache: npm
      # npm install yerine npm ci: lockfile birebir uygulanir.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Tanimsiz CSS degiskenini ne derleme ne lint goruyor (bkz.
      # scripts/check-css-vars.mjs). Denetim `build`'in basinda da var ama CI
      # artik derleme yapmiyor; PR'da erken gorunsun diye burada ayrica.
      - run: npm run check:css
      # Sepet ve ödeme tutarları ARC'ın sipariş hesabını aynalıyor
      # (lib/order-quote.ts); iki taraf ayrılırsa burada yakalanır.
      - run: npm test
      # Koddaki tablo/sütun/fonksiyon adları canlı şemada var mı
      # (supabase/schema/katalog.json). Supabase istemcisi tipsiz; yanlış
      # sütun adı derlemede görünmez, üretimde sessizce boş veri döndürür.
      - name: Şema sözleşmesi
        run: npm run check:schema
